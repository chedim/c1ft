[package]
name = "c1ft"
version = "0.1.0"
edition = "2021"
description = "c1ft: tests written in c1f, run on the cliffvm engine; a result is cached by the content of everything the test reads, so a change reruns only the tests it touches"
repository = "https://github.com/chedim/c1ft"
readme = "README.md"

[lib]
name = "c1ft"

[[bin]]
name = "c1ft"
path = "src/main.rs"

[dependencies]
# the engine: any 0.4 release from 0.4.1, or a working tree patched in (`--config 'patch.crates-io.cliffvm.path="<tree>"'`); the cache key hashes the program, so it knows which
cliffvm = { version = ">=0.4.1, <0.5", default-features = false, features = ["store"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
